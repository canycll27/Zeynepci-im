<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeynep'e Özel ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c003e 100%);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            text-align: center;
        }

        #content {
            z-index: 10;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .heart {
            color: #ff2e63;
            font-size: 100px;
            filter: drop-shadow(0 0 20px #ff2e63);
            animation: pulse 1.2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        .message {
            display: none;
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 25px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        h2 {
            font-size: 30px;
            margin-bottom: 10px;
            color: #ff2e63;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        .bg-heart {
            position: absolute;
            color: rgba(255, 46, 99, 0.2);
            animation: float 5s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes float {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="content" onclick="baslat()">
        <div class="heart" id="heart-icon">❤️</div>
        <h1 id="main-text">Zeynep, Buraya Tıkla...</h1>
        <div class="message" id="love-message">
            <h2>İyi ki Hayatımdasın Zeynep!</h2>
            <p>Seninle geçen her anım bir mucize gibi.<br>
            Seni çok seviyorum!</p>
        </div>
    </div>

    <audio id="myAudio">
        <source src="sarki.mp3" type="audio/mpeg">
    </audio>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script>
        function baslat() {
            var audio = document.getElementById("myAudio");
            audio.play().catch(function(error) {
                console.log("Müzik çalma hatası: ", error);
            });

            document.getElementById("main-text").style.display = "none";
            document.getElementById("heart-icon").style.fontSize = "60px";
            document.getElementById("love-message").style.display = "block";

            // Coşkulu Konfeti Efekti
            var end = Date.now() + (15 * 1000);
            var colors = ['#ff2e63', '#ffffff', '#ffbd69'];

            (function frame() {
                confetti({
                    particleCount: 3,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: colors
                });
                confetti({
                    particleCount: 3,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: colors
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // Arka planda süzülen kalpler
        setInterval(() => {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = Math.random() * 30 + 10 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 400);
    </script>
</body>
</html>
